# racik — sweep DUMMY: sanity-check algoritme pencari pada fungsi objektif
# sintetis yang optimumnya diketahui (≈0.90). Tidak butuh GPU, selesai detik.
# Algoritme yang benar harus mendekati optimum lebih cepat daripada random.

backend: dummy
task: >
  Verifikasi implementasi algoritme pencari pada permukaan skor sintetis
  (optimum diketahui: tiny + lr sekitar 3e-3 + adam + residual + depth 3 +
  width 48 + SE + augment basic).

dummy:
  noise: 0.02

space:
  arch:      {type: choice, options: [tiny, resnet18, mobilenet_v3_small]}
  lr:        {type: loguniform, low: 0.0001, high: 0.01}
  optimizer: {type: choice, options: [adam, sgd]}
  augment:   {type: choice, options: [none, basic]}
  depth:     {type: int, low: 2, high: 4, when: {arch: tiny}}
  width:     {type: choice, options: [16, 32, 48], when: {arch: tiny}}
  block:     {type: choice, options: [basic, residual, depthwise], when: {arch: tiny}}
  use_se:    {type: choice, options: [true, false], when: {arch: tiny}}
